# Base de données : les valeurs viennent des variables d'environnement
# (aucun mot de passe dans le code)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_notes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# "none" par défaut ; mettre DDL_AUTO=update en local pour créer les tables
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Clé de signature des jetons JWT (au moins 32 caractères)
jwt.secret=${JWT_SECRET}

server.port=8081
